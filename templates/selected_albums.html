{% for album in album_data %}
    <div>
        <h3>{{ album.name }}</h3>
        {% if album.img_path %}
            <img src="{{ url_for('static', filename=album.img_path.replace('static/', '')) }}" width="200">
        {% else %}
            <p>Image not available.</p>
        {% endif %}
    </div>
{% endfor %}
