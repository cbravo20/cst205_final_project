<div class="album-container">
{% for album in album_data %}
    <div class="album-card">
        <h3>{{ album.name }}</h3>
        {% if album.img_path %}
            <img src="{{ url_for('static', filename=album.img_path.replace('static/', '')) }}">
        {% else %}
            <p>Image not available.</p>
        {% endif %}
    </div>
{% endfor %}
</div>
