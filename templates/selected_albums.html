{% for album in album_data %}
    <p>{{ album.name }}</p>
    {% if album.img_path %}
        <img src="{{ url_for('static', filename=album.img_path) }}" width="200">
    {% else %}
        <p>Image not available.</p>
    {% endif %}
    <br>
{% endfor %}

<p><a href="{{ url_for('index') }}">Back to Search</a></p>
