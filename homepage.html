<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final Project CST205</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background-color: black;
      color: white;
    }

    .header {
      background-color: #1DB954;
      height: 145px;
      display: flex;
      align-items: center;
      padding-left: 32px;
    }

    .header h1 {
      font-size: 34px;
      font-weight: normal;
      color: black;
    }

    .main {
      min-height: calc(100vh - 145px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 55px;
    }

    .login-box {
      text-align: left;
    }

    .login-box p {
      font-size: 16px;
      margin-bottom: 28px;
      color: #e8e8e8;
    }

    .search-row {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .search-row input {
      width: 223px;
      height: 23px;
      border: none;
      border-radius: 4px;
      background-color: #ddd;
      padding: 4px 8px;
      font-size: 14px;
      color: black;
    }

    .search-row button {
      width: 77px;
      height: 30px;
      border: none;
      border-radius: 4px;
      background-color: #ddd;
      color: black;
      font-size: 14px;
      cursor: pointer;
    }

    .search-row button:hover {
      background-color: #cfcfcf;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Final Project CST205</h1>
  </header>

  <main class="main">
    <div class="login-box">
      <p>Login with Spotify to see your Top Tracks</p>
      <div class="search-row">
        <input type="text" />
        <button>Search</button>
      </div>
    </div>
  </main>
</body>
</html>
